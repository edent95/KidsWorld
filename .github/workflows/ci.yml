name: CI
on:
  pull_request:
  workflow_dispatch:          # 不在 push main 上重跑:PR 上已经跑过
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci                  # ← main 的必需检查名;改名要同步改分支保护
    # 公开仓库:跑 GitHub 托管的 ubuntu(免费),不上 M1 自托管 runner —— 任何人都能开 fork PR。
    # 不要给这个仓库设 CI_RUNS_ON。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # 没有 npm 依赖,不用 npm ci
      - run: npm run check
